spring.application.name=kakuge
server.port=8080

# ===== データベース：H2（Javaに内蔵。MySQLのインストール不要） =====
spring.datasource.url=jdbc:h2:file:./data/db/kakuge
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# ===== アップロード上限（録画ファイルは大きいので広めに） =====
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ===== 動画ファイルの保存先フォルダ =====
app.storage.dir=./data/videos
